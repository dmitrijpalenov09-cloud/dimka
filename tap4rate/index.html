<!doctype html>
<html lang="ru">

  <meta name="theme-color" content="#0A0B0E">

  <title>Tap4Rate — NFC-стенды · концепт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <div id="app">
    <div class="concept">Концепт приложения для Tap4Rate · не официальное</div>
    <main id="view" class="view"></main>
    <div id="cta" class="cta" hidden><button type="button" class="btn" id="cta-btn"></button></div>
    <nav id="tabs" class="tabs">
      <button type="button" data-tab="home"><svg viewBox="0 0 24 24"><rect x="6" y="3.5" width="12" height="9" rx="1.8"/><path d="M8 20.5h8M12 12.5v8"/><path d="M14.5 6.5a2.5 2.5 0 0 1 0 3"/></svg>Стенд</button>
      <button type="button" data-tab="make"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5 16z"/><path d="M14 7l3 3"/></svg>Конструктор</button>
      <button type="button" data-tab="opt"><svg viewBox="0 0 24 24"><path d="M3.5 8.5L12 4l8.5 4.5L12 13z"/><path d="M3.5 12.5L12 17l8.5-4.5M3.5 16.5L12 21l8.5-4.5"/></svg>Опт</button>
      <button type="button" data-tab="cart"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>Корзина<i class="badge" hidden></i></button>
    </nav>
  </div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="data.js"></script>
  <script src="card.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
