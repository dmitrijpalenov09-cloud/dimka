<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#140D1A">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>LaBuket — концепт приложения</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <div class="concept">Концепт для магазина LaBuket · не официальное приложение</div>
    <main id="view" class="view"></main>
    <div id="cta" class="cta" hidden><button type="button" class="btn" id="cta-btn"></button></div>
    <nav id="tabs" class="tabs">
      <button type="button" data-tab="home"><span class="ico">⌂</span>Главная</button>
      <button type="button" data-tab="catalog"><span class="ico">✿</span>Каталог</button>
      <button type="button" data-tab="cart"><span class="ico">🛍</span>Корзина<i class="badge" hidden></i></button>
      <button type="button" data-tab="orders"><span class="ico">◷</span>Заказы</button>
    </nav>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
