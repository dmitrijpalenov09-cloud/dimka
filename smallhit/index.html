<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0E0E0F">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Small Hit — концепт приложения</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <div class="concept">Концепт для барбершопа Small Hit · не официальное приложение</div>
    <main id="view" class="view"></main>
    <div id="cta" class="cta" hidden><button type="button" class="btn" id="cta-btn"></button></div>
    <nav id="tabs" class="tabs">
      <button type="button" data-tab="now"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Сегодня</button>
      <button type="button" data-tab="team"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M16 14.2c2.4 0 4 1.6 4.5 4.3"/></svg>Мастера</button>
      <button type="button" data-tab="prices"><svg viewBox="0 0 24 24"><circle cx="6.5" cy="7" r="2.5"/><circle cx="6.5" cy="17" r="2.5"/><path d="M8.6 8.4L20 17M8.6 15.6L20 7"/></svg>Цены</button>
      <button type="button" data-tab="my"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Мои<i class="badge" hidden></i></button>
    </nav>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
