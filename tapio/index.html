<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0A0B0E">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Tapio — NFC-карты для отзывов · концепт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <div class="concept">Концепт приложения для Tapio · не официальное</div>
    <main id="view" class="view"></main>
    <div id="cta" class="cta" hidden><button type="button" class="btn" id="cta-btn"></button></div>
    <nav id="tabs" class="tabs">
      <button type="button" data-tab="home"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M14.5 10a2.5 2.5 0 0 1 0 4M17 8.5a5 5 0 0 1 0 7"/></svg>Карта</button>
      <button type="button" data-tab="make"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5 16z"/><path d="M14 7l3 3"/></svg>Конструктор</button>
      <button type="button" data-tab="opt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M10 17V7.5h3a2.5 2.5 0 0 1 0 5H8.5M8.5 14.5h5"/></svg>Заработок</button>
      <button type="button" data-tab="cart"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>Корзина<i class="badge" hidden></i></button>
    </nav>
  </div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="data.js"></script>
  <script src="card.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
